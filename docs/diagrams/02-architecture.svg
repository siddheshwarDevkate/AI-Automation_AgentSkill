<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 730" role="img" aria-label="Two-row architecture sized for a slide. Top row: MCP connectors feed Agent One, which has orchestrator, skills and knowledge layers, producing a test case file that a human reviews. Bottom row: Agent Two, with the same three-part structure, produces a framework that is compiled, executed and passing, which an engineer then reviews before approval. Review feedback regenerates only the affected artefact.">
  <rect width="100%" height="100%" fill="#0A1016"/>
  <defs>
    <marker id="g1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8FA7B6"/></marker>
    <marker id="g2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#B9A6E4"/></marker>
    <marker id="g3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#E2A455"/></marker>
  </defs>

  <text x="640" y="40" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="23" fill="#E4EBF1">One pattern, two agents, two human checkpoints</text>

  <!-- ============ ROW 1 ============ -->
  <text x="60" y="66" font-family="ui-monospace,Menlo,monospace" font-size="12.5" fill="#71808A" letter-spacing=".14em">PHASE 1 — UNDERSTAND &amp; SPECIFY</text>

  <!-- MCP -->
  <rect x="60" y="76" width="250" height="224" rx="4" fill="#141F28" stroke="#2A3B47" stroke-width="1.5"/>
  <text x="185" y="102" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="15" fill="#9FB3C0">MCP LAYER</text>
  <g font-family="ui-monospace,Menlo,monospace" font-size="14" fill="#D6E1E8">
    <rect x="76" y="114" width="218" height="42" rx="3" fill="#1B2A36"/><text x="185" y="141" text-anchor="middle">Jira — user stories</text>
    <rect x="76" y="161" width="218" height="42" rx="3" fill="#1B2A36"/><text x="185" y="188" text-anchor="middle">Confluence — wiki</text>
    <rect x="76" y="208" width="218" height="42" rx="3" fill="#1B2A36"/><text x="185" y="235" text-anchor="middle">Doc reader — specs</text>
    <rect x="76" y="255" width="218" height="42" rx="3" fill="#1B2A36"/><text x="185" y="282" text-anchor="middle">Playwright MCP</text>
  </g>
  <line x1="310" y1="188" x2="344" y2="188" stroke="#8FA7B6" stroke-width="2" marker-end="url(#g1)"/>

  <!-- AGENT 1 -->
  <rect x="348" y="76" width="520" height="224" rx="4" fill="#0F1E2B" stroke="#5AB0EA" stroke-width="2"/>
  <text x="608" y="100" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="18" fill="#5AB0EA">AGENT 1 — Test Case Generation</text>
  <g font-family="ui-monospace,Menlo,monospace">
    <rect x="360" y="112" width="157" height="176" rx="3" fill="#16283a" stroke="#3A5670"/>
    <text x="438" y="138" text-anchor="middle" font-size="14" fill="#BBD2E2">ORCHESTRATOR</text>
    <text x="438" y="170" text-anchor="middle" font-size="13" fill="#8FA7B6">sequences work</text>
    <text x="438" y="196" text-anchor="middle" font-size="13" fill="#8FA7B6">validates inputs</text>
    <text x="438" y="222" text-anchor="middle" font-size="13" fill="#8FA7B6">writes nothing</text>
    <text x="438" y="248" text-anchor="middle" font-size="13" fill="#8FA7B6">itself</text>

    <rect x="529" y="112" width="157" height="176" rx="3" fill="#16283a" stroke="#3A5670"/>
    <text x="607" y="138" text-anchor="middle" font-size="14" fill="#BBD2E2">SKILLS</text>
    <text x="607" y="170" text-anchor="middle" font-size="13" fill="#8FA7B6">read story</text>
    <text x="607" y="196" text-anchor="middle" font-size="13" fill="#8FA7B6">read docs / wiki</text>
    <text x="607" y="222" text-anchor="middle" font-size="13" fill="#8FA7B6">explore the app</text>
    <text x="607" y="248" text-anchor="middle" font-size="13" fill="#8FA7B6">reconcile sources</text>

    <rect x="698" y="112" width="157" height="176" rx="3" fill="#16283a" stroke="#3A5670"/>
    <text x="776" y="138" text-anchor="middle" font-size="14" fill="#BBD2E2">KNOWLEDGE</text>
    <text x="776" y="170" text-anchor="middle" font-size="13" fill="#8FA7B6">test case format</text>
    <text x="776" y="196" text-anchor="middle" font-size="13" fill="#8FA7B6">field schema</text>
    <text x="776" y="222" text-anchor="middle" font-size="13" fill="#8FA7B6">coverage rules</text>
    <text x="776" y="248" text-anchor="middle" font-size="13" fill="#8FA7B6">no-fabrication</text>
  </g>
  <line x1="868" y1="188" x2="902" y2="188" stroke="#B9A6E4" stroke-width="2" marker-end="url(#g2)"/>

  <!-- REVIEW 1 -->
  <rect x="906" y="76" width="314" height="224" rx="4" fill="#1B1630" stroke="#8C74C8" stroke-width="2"/>
  <text x="1063" y="104" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="16" fill="#B9A6E4">TEST CASE FILE</text>
  <text x="1063" y="128" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="13.5" fill="#9585BE">.xlsx / .csv</text>
  <line x1="930" y1="146" x2="1196" y2="146" stroke="#5A4A7E" stroke-width="1"/>
  <text x="1063" y="176" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="16" fill="#D9C9F5">HUMAN REVIEW 1</text>
  <text x="1063" y="208" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="13.5" fill="#9585BE">BA / QA check scope</text>
  <text x="1063" y="232" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="13.5" fill="#9585BE">and coverage</text>
  <text x="1063" y="266" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="13.5" fill="#D9C9F5">before any code exists</text>

  <!-- WRAP CONNECTOR -->
  <path d="M 1063 302 L 1063 330 L 90 330 L 90 366" fill="none" stroke="#B9A6E4" stroke-width="2" marker-end="url(#g2)"/>
  <text x="576" y="324" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="13.5" fill="#B9A6E4">approved test cases feed the build phase</text>

  <!-- ============ ROW 2 ============ -->
  <text x="60" y="360" font-family="ui-monospace,Menlo,monospace" font-size="12.5" fill="#71808A" letter-spacing=".14em">PHASE 2 — BUILD &amp; VERIFY</text>

  <!-- AGENT 2 -->
  <rect x="60" y="370" width="520" height="224" rx="4" fill="#0E2119" stroke="#48C48A" stroke-width="2"/>
  <text x="320" y="394" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="18" fill="#48C48A">AGENT 2 — Framework Generation</text>
  <g font-family="ui-monospace,Menlo,monospace">
    <rect x="72" y="406" width="157" height="176" rx="3" fill="#14302a" stroke="#356E56"/>
    <text x="150" y="432" text-anchor="middle" font-size="14" fill="#B8D8C7">ORCHESTRATOR</text>
    <text x="150" y="464" text-anchor="middle" font-size="13" fill="#94B8A5">preflight gate</text>
    <text x="150" y="490" text-anchor="middle" font-size="13" fill="#94B8A5">dependency</text>
    <text x="150" y="514" text-anchor="middle" font-size="13" fill="#94B8A5">matrix</text>
    <text x="150" y="546" text-anchor="middle" font-size="13" fill="#94B8A5">delivery gate</text>

    <rect x="241" y="406" width="157" height="176" rx="3" fill="#14302a" stroke="#356E56"/>
    <text x="319" y="432" text-anchor="middle" font-size="14" fill="#B8D8C7">10 SKILLS</text>
    <text x="319" y="464" text-anchor="middle" font-size="13" fill="#94B8A5">locators · pages</text>
    <text x="319" y="490" text-anchor="middle" font-size="13" fill="#94B8A5">assertions · data</text>
    <text x="319" y="516" text-anchor="middle" font-size="13" fill="#94B8A5">specs · validate</text>
    <text x="319" y="542" text-anchor="middle" font-size="13" fill="#94B8A5">execute · review</text>

    <rect x="410" y="406" width="157" height="176" rx="3" fill="#14302a" stroke="#356E56"/>
    <text x="488" y="432" text-anchor="middle" font-size="14" fill="#B8D8C7">KNOWLEDGE +</text>
    <text x="488" y="450" text-anchor="middle" font-size="14" fill="#B8D8C7">TEMPLATES</text>
    <text x="488" y="482" text-anchor="middle" font-size="13" fill="#94B8A5">locator strategy</text>
    <text x="488" y="508" text-anchor="middle" font-size="13" fill="#94B8A5">POM · TS rules</text>
    <text x="488" y="534" text-anchor="middle" font-size="13" fill="#94B8A5">code templates</text>
  </g>
  <line x1="580" y1="482" x2="614" y2="482" stroke="#48C48A" stroke-width="2" marker-end="url(#g1)"/>

  <!-- FRAMEWORK -->
  <rect x="618" y="370" width="280" height="224" rx="4" fill="#0E2119" stroke="#48C48A" stroke-width="2"/>
  <text x="758" y="398" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="16" fill="#48C48A">FRAMEWORK</text>
  <g font-family="ui-monospace,Menlo,monospace" font-size="13.5" fill="#C6DCD1">
    <text x="758" y="430" text-anchor="middle">pages · tests · utils</text>
    <text x="758" y="454" text-anchor="middle">test-data · fixtures</text>
    <text x="758" y="478" text-anchor="middle">traceability report</text>
    <text x="758" y="502" text-anchor="middle">execution report</text>
  </g>
  <line x1="642" y1="520" x2="874" y2="520" stroke="#2C5E48" stroke-width="1"/>
  <text x="758" y="550" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="14.5" fill="#48C48A">✓ compiled ✓ executed</text>
  <text x="758" y="574" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="14.5" fill="#48C48A">✓ passing</text>
  <line x1="898" y1="482" x2="932" y2="482" stroke="#B9A6E4" stroke-width="2" marker-end="url(#g2)"/>

  <!-- REVIEW 2 -->
  <rect x="936" y="370" width="284" height="224" rx="4" fill="#1B1630" stroke="#8C74C8" stroke-width="2"/>
  <text x="1078" y="398" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="16" fill="#D9C9F5">HUMAN REVIEW 2</text>
  <text x="1078" y="422" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="14" fill="#B9A6E4">CODE REVIEW</text>
  <line x1="960" y1="440" x2="1196" y2="440" stroke="#5A4A7E" stroke-width="1"/>
  <g font-family="ui-monospace,Menlo,monospace" font-size="13.5" fill="#9585BE">
    <text x="1078" y="468" text-anchor="middle">engineer reviews the</text>
    <text x="1078" y="492" text-anchor="middle">generated framework</text>
    <text x="1078" y="516" text-anchor="middle">structure · locators</text>
    <text x="1078" y="540" text-anchor="middle">coverage · reports</text>
  </g>
  <text x="1078" y="574" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="14" fill="#D9C9F5">approve or send back</text>

  <!-- FEEDBACK LOOP -->
  <path d="M 1078 596 L 1078 628 L 320 628 L 320 598" fill="none" stroke="#E2A455" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#g3)"/>
  <text x="699" y="650" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="13.5" fill="#E2A455">review feedback → regenerate only the affected artefact</text>

  <!-- FOOTER -->
  <line x1="60" y1="676" x2="1220" y2="676" stroke="#1D2A33" stroke-width="1"/>
  <text x="640" y="706" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="14.5" fill="#5AB0EA">orchestrator decides WHEN · knowledge decides HOW WELL · templates decide WHAT SHAPE · a human signs off at both ends</text>
</svg>
